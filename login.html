<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — Kemet</title>
<meta name="description" content="Connectez-vous à votre compte Kemet pour accéder à vos ebooks.">
<link rel="icon" href="assets/img/logo.jpg" type="image/jpeg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="kemet-header" data-active="login"></div>

<main>
  <section class="hero" style="padding-bottom:60px;">
    <div class="container" style="max-width:520px;">
      <span class="eyebrow">Bibliothèque Kemet</span>
      <h1 style="font-size:clamp(2rem,4vw,3.2rem);">Connexion</h1>
      <p class="lead">Accédez à vos ebooks et à votre bibliothèque personnelle.</p>
    </div>
  </section>

  <section style="padding-top:0; padding-bottom:100px;">
    <div class="container" style="max-width:480px;">

      <form class="form" id="login-form" novalidate>
        <h2 style="margin-bottom:6px; font-size:1.4rem;">Se connecter</h2>
        <p class="muted" style="margin-bottom:0; font-size:.9rem;">Pas encore de compte ? <a href="register.html">Créer un compte</a></p>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="votre@email.fr">

        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">

        <div style="margin-top:28px;">
          <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;" id="submit-btn">
            Se connecter
          </button>
        </div>

        <div class="form-status" id="form-status" role="alert" aria-live="polite"></div>
      </form>

      <p style="text-align:center; margin-top:28px; font-size:.88rem; color:var(--ink-soft);">
        En vous connectant vous acceptez nos <a href="#">conditions d'utilisation</a>.
      </p>
    </div>
  </section>
</main>

<div id="kemet-footer"></div>

<script src="assets/js/components.js"></script>
<script src="assets/js/main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/kemet-config.js"></script>
<script src="assets/js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  updateNavAuth();
  // Si déjà connecté, rediriger
  if (getSession()) window.location.href = 'dashboard.html';

  const form   = document.getElementById('login-form');
  const status = document.getElementById('form-status');
  const btn    = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    status.classList.remove('is-visible');
    btn.textContent = 'Connexion en cours…';
    btn.disabled = true;

    const email    = form.email.value.trim();
    const password = form.password.value;

    try {
      const user = await kemetLogin(email, password);
      status.style.borderColor = 'var(--lapis)';
      status.style.background  = 'rgba(31,58,138,.07)';
      status.innerHTML = `<strong>Bienvenue, ${user.name}.</strong> Redirection…`;
      status.classList.add('is-visible');
      setTimeout(() => {
        const next = new URLSearchParams(location.search).get('next');
        window.location.href = next || 'dashboard.html';
      }, 800);
    } catch (err) {
      status.style.borderColor = 'var(--terracotta)';
      status.style.background  = 'rgba(166,75,42,.07)';
      status.innerHTML = err.message;
      status.classList.add('is-visible');
      btn.textContent = 'Se connecter';
      btn.disabled = false;
    }
  });
});
</script>
</body>
</html>
